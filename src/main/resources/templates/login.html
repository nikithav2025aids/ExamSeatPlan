<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SeatPlan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-body">
<div class="login-card">
    <div class="login-header">
        <h1 class="login-app-title">SeatPlan</h1>
        <p class="login-app-sub">Exam Hall Seating Arrangement Generator</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
        Invalid credentials.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Sign In</button>
    </form>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
